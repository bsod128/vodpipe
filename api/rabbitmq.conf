# RabbitMQ 4 disables deprecated AMQP 0-9-1 features by default.
# Celery (mingle/pidbox) declares a transient non-exclusive queue and gets
# AMQP 541 INTERNAL_ERROR "Feature `transient_nonexcl_queues` is deprecated",
# after which the worker dies with "Frequent restarts detected".
# Permit exactly what Celery needs; everything else stays off.
deprecated_features.permit.transient_nonexcl_queues = true