[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vodpipe"
version = "1.0.3"
description = "FFmpeg/NVENC VOD pipeline: chunked parallel transcode, CMAF HLS/DASH packaging, watermarking, VMAF, job queue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexey Shlykov" }]
keywords = ["ffmpeg", "nvenc", "hls", "dash", "cmaf", "vmaf", "video", "transcoding"]

# The pipeline core only needs the standard library: it shells out to ffmpeg.
dependencies = []

[project.optional-dependencies]
# HTTP API + queue worker (docker compose brings the broker and the cache).
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "celery>=5.4",
    "redis>=5.0",
    "pika>=1.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
vodpipe = "vodpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["work", "out", "bin"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["src/vodpipe"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "ffmpeg: test needs a real ffmpeg binary (skipped when VODPIPE_FFMPEG is absent)",
    "gpu: test needs a working NVENC (skipped unless VODPIPE_GPU_TESTS=1)",
]
