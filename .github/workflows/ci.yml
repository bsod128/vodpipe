name: CI

# The pipeline shells out to ffmpeg and the encoder/parallelism conclusions need
# a GPU, so CI proves the part that does not: the pure logic (argument
# construction, ffmpeg output parsing, range handling, job state mapping).
# GPU-dependent tests carry the `gpu` marker and skip on this runner.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        env:
          VODPIPE_FFMPEG: ffmpeg
        run: pytest -q
